- id: stopiteration-in-generator
  question: "What happens if a generator body executes raise StopIteration?"
  options:
    - "The generator ends quietly, like return"
    - "The loop that uses it keeps going"
    - "Python turns it into a RuntimeError"
    - "The generator restarts"
  answer: 2
  explanation: "A StopIteration that escapes a generator body is converted to RuntimeError, so a bug cannot silently end a loop early. Use return to finish a generator."
  whyWrong:
    "0": "That is what return does. Raising StopIteration by hand is converted into an error instead."
    "1": "The error stops the loop with a traceback."
    "3": "Generators never restart; once finished, they stay finished."

- id: spot-bug-second-pass
  kind: spot-bug
  question: "This code raises ZeroDivisionError. What is the bug?"
  code: |
    squares = (n * n for n in range(4))
    total = sum(squares)
    average = total / len(list(squares))
  options:
    - "sum already used up the generator, so list(squares) is empty"
    - "A generator has no length, so len cannot be used"
    - "total is a float"
    - "range(4) starts at 1"
  answer: 0
  explanation: "sum(squares) walks the generator to the end. The second pass, list(squares), finds nothing, so the length is 0 and the division fails. Build a list first (or compute the count another way) if you need two passes."
  whyWrong:
    "1": "len is applied to the list built from the generator, and that is allowed; the list is simply empty."
    "2": "total is an int here, and the type is not the problem."
    "3": "range(4) starts at 0, and that is not related to the error."

