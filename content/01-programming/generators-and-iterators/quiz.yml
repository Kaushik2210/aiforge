    "3": "The second sum cannot see the items again, so it does not double."

- id: predict-iter-identity
  kind: predict-output
  question: "What does this print?"
  code: |
    nums = [1, 2, 3]
    it = iter(nums)
    print(iter(nums) is nums, iter(it) is it)
  options:
    - "True True"
    - "False False"
    - "True False"
    - "False True"
  answer: 3
  explanation: "A list makes a brand-new iterator each time, so iter(nums) is not nums. An iterator is its own iterator, so iter(it) is it."
  whyWrong:
    "0": "A list is iterable but not an iterator, so it is not what iter(nums) returns."
    "1": "Iterators return themselves from iter(), which is what lets a for loop accept them."
    "2": "That has the two answers the wrong way round."

- id: predict-generator-timing
  kind: predict-output
  question: "What does this print?"
  code: |
    def noisy():
        print("start")
        yield 1

    g = noisy()
    print("made")
    next(g)
  options:
    - "start, then made"
    - "made, then start"
    - "Only made"
    - "Only start"
  answer: 1
  explanation: "Calling noisy() only creates the generator. The body, including the first print, runs when next() asks for the first item."
  whyWrong:
    "0": "That would be true for an ordinary function, which runs its body at the call."
    "2": "next(g) does run the body up to the first yield, so start is printed."
    "3": "The line print('made') runs before next(g) is called."

- id: predict-next-default
  kind: predict-output
  question: "What does this print?"
  code: |
    print(next(iter([]), "none"))
  options:
    - "None"
    - "An empty list"
    - "StopIteration"
    - "none"
  answer: 3
  explanation: "The iterator over an empty list is already finished, so next returns the default you gave it instead of raising."
  whyWrong:
    "0": "The default is the string you passed, not None."
    "1": "The default is the string 'none'."
    "2": "Without the default it would raise StopIteration; with one, it returns the default."

- id: exhausted-raises
  question: "What does next(it) do when the iterator is finished and you gave no default?"
  options:
    - "Raises StopIteration"
    - "Returns None"
    - "Starts over from the first item"
    - "Raises IndexError"
  answer: 0
  explanation: "StopIteration is how an iterator says it is done. A for loop catches it and ends quietly."
  whyWrong:
    "1": "Returning None would be ambiguous because an iterator can legitimately yield None."
    "2": "Iterators cannot restart; make a new one from the iterable."
    "3": "IndexError belongs to indexing sequences, not to the iterator protocol."

- id: late-validation
  question: "def check(n): if n < 1: raise ValueError  ...  yield n.  When does check(0) raise ValueError?"
  options:
    - "At the call check(0)"
    - "When the first item is requested, for example with next()"
    - "Never, because generators ignore exceptions"
    - "When the generator is deleted"
  answer: 1
  explanation: "A function containing yield is a generator function. Calling it only creates the generator, so the body, including the check, does not run until the first next."
  whyWrong:
    "0": "That would be true for a normal function. A generator function defers all of its body."
    "2": "Exceptions in generators behave normally; they just happen late."
    "3": "Deleting a generator does not run its body or raise this error."

- id: predict-zip-consumes
  kind: predict-output
  question: "What does this print?"
  code: |
    a = iter([1, 2, 3])
    b = iter("ab")
    list(zip(a, b))
    print(list(a))
  options:
    - "[3]"
    - "[1, 2, 3]"
    - "[]"
    - "[2, 3]"
  answer: 2
  explanation: "zip asks a for its next item (3) before it finds that b is empty, so the 3 is taken and thrown away. Nothing is left in a."
  whyWrong:
    "0": "That would be the leftover if the arguments were the other way round, because zip asks the first iterator first."
    "1": "The items were consumed by zip, so a is not untouched."
    "3": "zip took three items from a, not one."

