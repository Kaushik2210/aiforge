- id: predict-iterator-twice
  kind: predict-output
  question: "What does this print?"
  code: |
    it = iter([1, 2, 3])
    print(list(it), list(it))
  options:
    - "[1, 2, 3] [1, 2, 3]"
    - "[] []"
    - "[1, 2, 3] []"
    - "[1, 2, 3] [2, 3]"
  answer: 2
  explanation: "The first list() walks the iterator to the end and uses it up. The second finds nothing left."
  whyWrong:
    "0": "That is what you would get from the list itself, which can be walked again, but an iterator cannot."
    "1": "The first call still gets all three items."
    "3": "An iterator does not restart or keep a copy; after the first walk it is empty."

