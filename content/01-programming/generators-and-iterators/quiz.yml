- id: iterable-class
  question: "A class defines __iter__ as a generator method (it uses yield). What happens when you loop over one instance twice?"
  options:
    - "The second loop is empty"
    - "The second loop continues where the first stopped"
    - "Each loop starts from the beginning"
    - "It raises RuntimeError"
  answer: 2
  explanation: "Every call to __iter__ runs the generator body from the top with its own variables, so each loop is a fresh walk."
  whyWrong:
    "0": "That would happen if __iter__ returned self and the position lived on the object."
    "1": "The position is stored in each generator, not on the instance, so loops do not share it."
    "3": "Nothing here is an error."

- id: for-on-iterator
  question: "Why can a for loop run directly over an iterator?"
  options:
    - "Because iterators are lists"
    - "Because iter(it) returns the iterator itself, so it counts as iterable"
    - "Because for converts everything to a list first"
    - "Because iterators define __len__"
  answer: 1
  explanation: "An iterator's __iter__ returns itself, so the loop can ask it for an iterator and then call next on it."
  whyWrong:
    "0": "Iterators are not lists; that is why they are used up."
    "2": "A for loop does not build a list; it calls next one item at a time."
    "3": "Most iterators have no length at all."

