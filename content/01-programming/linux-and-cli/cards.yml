- { id: c-shell-job, front: "What does the shell do before it starts your program?", back: "It splits the line into words, removes quotes, expands variables and wildcards, sets up redirections, and only then starts the program with the final list of arguments. The program never sees the quotes or the wildcard." }
- { id: c-glob-shell, front: "Who expands *.txt, the shell or the program?", back: "The shell. The program receives the list of matching names. If nothing matches, POSIX says the pattern is left unchanged, so the program gets the literal text." }
- { id: c-word-split, front: "What does an unquoted variable expansion do?", back: "Its value is split into words (on space, tab and newline by default) and each word can then be globbed. Quote it, like rm -- \"$file\", to keep it as one argument." }
- { id: c-quote-single, front: "What do single quotes do in a shell?", back: "They keep every character inside literal: no variables, no backslash escapes. A single quote cannot appear inside single quotes." }
- { id: c-quote-double, front: "What do double quotes still allow?", back: "Variable and command expansion with $ and backticks, and a backslash, which inside double quotes escapes only $, backtick, double quote, backslash and newline." }
- { id: c-backslash-newline, front: "What does an unquoted backslash followed by a newline do?", back: "It is removed completely (line continuation). It does not separate words and it does not start a new one." }
- { id: c-fds, front: "What are file descriptors 0, 1 and 2?", back: "Standard input (0), standard output (1) and standard error (2). Every process starts with them open, and redirection changes where they point." }
- { id: c-redirect-order, front: "Why is > file 2>&1 different from 2>&1 > file?", back: "Redirections run left to right. 2>&1 makes fd 2 a copy of fd 1 as it is at that moment. In the first form fd 1 is already the file; in the second it is still the screen." }
- { id: c-pipe, front: "What does cmd1 | cmd2 do?", back: "It runs both at the same time and connects the standard output of cmd1 to the standard input of cmd2. By default the exit status of the pipeline is the status of the last command." }
- { id: c-exit-status, front: "What do exit status 0, 126, 127 and 128+N mean?", back: "0 is success. 126 means found but not executable. 127 means command not found. 128+N means killed by signal N, for example 143 for SIGTERM and 137 for SIGKILL." }
- { id: c-dollar-q, front: "What is $?", back: "The exit status of the most recently completed pipeline or command. Read it right away, because the next command replaces it." }
- { id: c-pipefail, front: "What does set -o pipefail change?", back: "A pipeline's status becomes the last non-zero status among its commands (or 0 if all succeed), instead of only the last command's status. POSIX added it in its 2024 edition." }
- { id: c-set-e, front: "Why is set -e not a full safety net?", back: "It is ignored in if and while conditions, in all but the last command of an && or || list, in pipelines (without pipefail) and inside anything run in those contexts, so some failures pass silently." }
- { id: c-three-classes, front: "How does the kernel choose which permission class applies?", back: "If you own the file the user bits apply. Otherwise, if you are in the file's group, the group bits apply. Otherwise the other bits apply. Only one class is used, and they never add up." }
- { id: c-octal, front: "How do you read the mode 754?", back: "Digits are user, group, other. 7 is rwx (4+2+1), 5 is r-x, 4 is r--. So 754 is rwxr-xr--. A fourth leading digit holds setuid (4), setgid (2) and sticky (1)." }
- { id: c-dir-x, front: "What do r, w and x mean on a directory?", back: "r lets you list the names, w lets you create and remove entries, and x (search) lets you pass through it to reach what is inside. Without x you cannot cd into it." }
- { id: c-umask, front: "What does umask do?", back: "It removes permission bits from the mode a program asks for when creating a file. With umask 022 a request for 666 becomes 644 and 777 becomes 755. It never adds bits." }
- { id: c-chmod-x, front: "What does capital X mean in chmod?", back: "Add execute only if the target is a directory or already has execute for someone. It opens up a tree without making plain files executable." }
- { id: c-setuid, front: "What do setuid, setgid and sticky do?", back: "Setuid or setgid on a program makes it run with the file owner's or group's identity. Setgid on a directory makes new files inherit its group. Sticky on a directory lets only a file's owner (or the directory's owner or root) delete or rename it." }
- { id: c-ls-s, front: "What do s, S, t and T mean in ls -l?", back: "Lowercase s or t means the special bit is set and the execute bit is also set under it. Capital S or T means the special bit is set but execute is not." }
- { id: c-path, front: "What is PATH and why avoid an empty entry?", back: "A colon-separated list of directories searched, left to right, for the command you typed. An empty entry means the current directory, which is risky because a look-alike file there could run instead of the real tool." }
- { id: c-env-inherit, front: "How does a child process get environment variables?", back: "It inherits a copy of its parent's environment (NAME=value strings) when it starts. Changing your copy does not change your parent's. In a shell, export hands a variable to the programs you start." }
- { id: c-sigterm-sigkill, front: "SIGTERM versus SIGKILL?", back: "SIGTERM (15) is a polite request that a program can catch to clean up. SIGKILL (9) cannot be caught, blocked or ignored, so there is no cleanup. Try TERM first and KILL last. kill with no option sends TERM." }
- { id: c-print0, front: "Why use find -print0 | xargs -0?", back: "File names can contain spaces and newlines. -print0 ends each name with a NUL byte, which a name can never contain, and xargs -0 splits on that and treats quotes and backslashes literally." }
- { id: c-find-delete, front: "What is the danger of find -delete?", back: "find evaluates its line as an expression, so placing -delete first makes it try to delete everything under the start point. -delete also implies -depth. Run with -print first." }
- { id: c-rm-unset, front: "Why can rm -rf $DIR/* be catastrophic?", back: "If DIR is unset or empty the path becomes /*. Guard it with set -u or the form ${DIR:?}, and quote the variable." }
- { id: c-ssh-perms, front: "What permissions should an SSH private key have?", back: "Readable only by you, usually mode 600 (and the ~/.ssh folder mode 700). OpenSSH ignores a private key that is accessible by others." }
- { id: c-sudo, front: "Why does sudo need care?", back: "It runs a command as root or another user, so a typo can destroy or expose far more than a normal user could. Use it for single commands, read before you run, and never sudo a script you have not read." }
- { id: c-shellcheck, front: "What does ShellCheck do?", back: "It is a static analysis tool that warns about mistakes in shell scripts, such as unquoted variables and shell-specific features, and it can run in CI." }
- { id: c-idempotent, front: "What makes a script idempotent?", back: "Running it twice gives the same result as once: mkdir -p, create-if-missing, write to a temporary file then mv into place. Cron and retries will run it more than once." }
- { id: c-cron-timer, front: "Cron versus a systemd timer?", back: "Cron runs a command at times given by five fields (minute, hour, day of month, month, day of week). A systemd .timer unit activates a matching .service, with calendar or boot-relative triggers and optional catch-up of missed runs." }
- { id: c-ns-cgroup, front: "Namespaces versus cgroups?", back: "Namespaces give a process its own view of things such as process IDs, mounts, network and host name. Cgroups limit and account for resources such as memory, CPU and process count. Containers combine them." }
- { id: c-oom, front: "Why can a training job vanish with exit status 137?", back: "137 is 128 + 9, SIGKILL. The kernel OOM killer (including inside a cgroup that reached memory.max) may have killed it, leaving no Python traceback. Check the kernel log and memory limits." }
