title: Apply a chmod mode spec
summary: "Write apply_chmod(mode, spec, is_dir=False, umask=0o022) that applies a chmod-style spec to a 12-bit permission mode (setuid, setgid, sticky, rwx for user, group, other) and returns the new mode, and mode_string(mode, is_dir=False) that returns the ls -l style text such as drwxr-xr-x (s, S, t, T for the special bits). Supported: octal specs (1 to 4 digits keep a directory's setuid and setgid, 5 or more digits do not; values above 7777 are invalid) and comma-separated symbolic clauses WHO OP PERMS with who in u g o a or empty, ops + - =, perms r w x X s t or one copy letter u g o. Empty WHO applies the umask to +, - and = (GNU behaviour), a WHO ignores the umask. u+s sets setuid, g+s sets setgid, o+s and u+t, g+t do nothing, = on a file also clears the special bits of the named classes, and = on a directory keeps setuid and setgid unless the clause has s. Only the low 12 bits of mode and the low 9 bits of umask count. Not supported (ValueError, message contains repr(spec)): operator-octal specs like +440 or =755, spaces, an empty spec, a WHO with no operator, junk after a copy letter. A non-str spec is a TypeError and a negative mode a ValueError. Expected values were checked against real GNU chmod 8.32 and the gnulib modechange.c source."
