title: Split a command line like sh
summary: "Write shell_split(line) that splits a command line into a list of arguments with a subset of POSIX sh quoting: unquoted space, tab and newline separate arguments (runs collapse); single quotes keep everything literal; inside double quotes a backslash escapes only backslash, double quote, dollar, backtick and newline (a backslash before anything else stays, with that character) and a backslash-newline disappears; an unquoted backslash keeps the next character literally, and an unquoted backslash-newline is removed without separating; adjacent quoted and unquoted parts join into one argument; '' or \"\" gives an empty argument. It performs no expansion, globbing, comments or operators, so $VAR, * and # are ordinary characters (so is the $ of $'...', which bash and POSIX 2024 treat specially; and an unquoted newline is just a separator here, where a real shell would end the command). An unterminated quote raises ValueError whose message contains the word quote, an unquoted backslash at the very end raises ValueError whose message contains the word backslash, and a non-str input raises TypeError. Cases were checked against a real POSIX-mode shell; Python's shlex.split differs (for example on backslash-dollar inside double quotes)."
