- id: list-versus-set-lookup
  question: "Roughly how does the time of `x in my_list` compare with `x in my_set` as the collection grows?"
  options:
    - "Both grow in proportion to the size"
    - "The list is constant; the set grows in proportion to its size"
    - "The list grows in proportion to its size (O(n)); the set is about constant on average (O(1))"
    - "Both are constant"
  answer: 2
  explanation: "A list check looks at items one by one. A set hashes the value and jumps to where it would be, so on average the cost does not grow with the size."
  whyWrong:
    "0": "Only the list scans item by item; a set uses the hash."
    "1": "That has the two reversed."
    "3": "A list has no index by value, so it must scan."

- id: predict-sort-stable
  kind: predict-output
  question: "What does this print?"
  code: |
    data = [("b", 2), ("a", 1), ("c", 2), ("d", 1)]
    print(sorted(data, key=lambda r: r[1]))
  options:
    - "[('a', 1), ('d', 1), ('b', 2), ('c', 2)]"
    - "[('d', 1), ('a', 1), ('c', 2), ('b', 2)]"
    - "[('a', 1), ('b', 2), ('c', 2), ('d', 1)]"
    - "[('b', 2), ('c', 2), ('a', 1), ('d', 1)]"
  answer: 0
  explanation: "The sort is stable: items with equal keys keep their original order. The 1s are a then d (as they were), and the 2s are b then c."
  whyWrong:
    "1": "That reverses the order of equal items, which a stable sort never does."
    "2": "That sorts by the letter, not by the number key."
    "3": "That puts the larger key first, which would need reverse=True."

- id: predict-bisect
  kind: predict-output
  question: "What does this print?"
  code: |
    from bisect import bisect_left, bisect_right

    a = [1, 2, 2, 2, 3]
    print(bisect_left(a, 2), bisect_right(a, 2))
  options:
    - "0 5"
    - "2 3"
    - "1 3"
    - "1 4"
  answer: 3
  explanation: "bisect_left gives the position before the equal items (index 1) and bisect_right the position after them (index 4)."
  whyWrong:
    "0": "Those are the positions for values smaller than everything and larger than everything."
    "1": "Neither function points into the middle of the run of 2s."
    "2": "bisect_right returns 4, after all three 2s, not 3."

- id: predict-nlargest
  kind: predict-output
  question: "What does this print?"
  code: |
    import heapq

    print(heapq.nlargest(3, [5, 1, 9, 3, 7, 9, 2]))
  options:
    - "[9, 7, 5]"
    - "[9, 9, 7]"
    - "[1, 2, 3]"
    - "[7, 9, 9]"
  answer: 1
  explanation: "nlargest returns the three largest items, largest first, and repeats are kept, so the two 9s both appear."
  whyWrong:
    "0": "The duplicate 9 counts as a separate item, so it takes one of the three places."
    "2": "That would be nsmallest."
    "3": "The result is in descending order, largest first."

- id: predict-counter-ties
