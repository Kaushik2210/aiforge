- id: import-runs-once
  question: "A module prints 'loading' at its top level. A program imports it twice in a row. How many times is 'loading' printed?"
  options:
    - "It depends on the file size"
    - "Twice"
    - "Zero times, because top-level code does not run on import"
    - "Once"
  answer: 3
  explanation: "Top-level code runs the first time the module is imported; later imports reuse the module that is already loaded."
  whyWrong:
    "0": "Size has no effect on how often the code runs."
    "1": "A second import finds the module already loaded and does not run it again."
    "2": "Top-level code does run on import, which is why heavy work belongs in functions."

- id: main-guard
  question: "What does if __name__ == \"__main__\": protect?"
  options:
    - "It stops other files from importing this one"
    - "It makes the code run faster"
    - "It makes the code inside run only when the file is run directly, not when it is imported"
    - "It marks the main function for the debugger"
  answer: 2
  explanation: "When a file is run as a script its __name__ is __main__; when it is imported __name__ is the module's name, so the block is skipped."
  whyWrong:
    "0": "Imports still work; the guard only skips the block."
    "1": "It has no effect on speed."
    "3": "Python does not treat it specially for debuggers."

- id: partial-call
  kind: predict-output
  question: "What does this print?"
  code: |
    from functools import partial

    def add(a, b=2):
        return a + b

    add10 = partial(add, 10)
    print(add10(5))
  options:
    - "12"
    - "15"
    - "10"
    - "5"
  answer: 1
  explanation: "partial fills in a=10 in advance, so add10(5) calls add(10, 5), which is 15."
  whyWrong:
    "0": "That would use the default b=2, but the call supplies 5 for b."
    "2": "The 5 you pass is added to the 10."
    "3": "The 10 that partial supplied is added too."
