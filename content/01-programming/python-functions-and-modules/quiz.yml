- id: kwargs-packing
  kind: predict-output
  question: "What does this print?"
  code: |
    def show(*args, **kwargs):
        return args, kwargs

    print(show(1, 2, a=3))
  options:
    - "([1, 2], {'a': 3})"
    - "((1, 2), ('a', 3))"
    - "(1, 2, 3)"
    - "((1, 2), {'a': 3})"
  answer: 3
  explanation: "*args collects the extra positional arguments into a tuple and **kwargs collects the extra keyword arguments into a dict."
  whyWrong:
    "0": "args is a tuple, not a list."
    "1": "kwargs is a dictionary, so it prints as {'a': 3}."
    "2": "The positional and keyword arguments are collected separately."

- id: keyword-only
  question: "Given def f(a, *, b): ..., what does f(1, 2) do?"
  options:
    - "Raises TypeError"
    - "Returns normally with b equal to 2"
    - "Raises SyntaxError"
    - "Ignores the 2"
  answer: 0
  explanation: "Parameters after a bare * are keyword-only, so b must be written f(1, b=2). Passing it by position raises TypeError."
  whyWrong:
    "1": "That is exactly what the bare * forbids."
    "2": "The call is syntactically fine; the error appears when it runs."
    "3": "Python never silently drops an extra argument."

- id: late-binding
  kind: predict-output
  question: "What does this print?"
  code: |
    fs = [lambda: i for i in range(3)]
    print([f() for f in fs])
  options:
    - "[0, 1, 2]"
    - "[2, 2, 2]"
    - "[3, 3, 3]"
    - "[0, 0, 0]"
  answer: 1
  explanation: "Each lambda looks up i when it is called, and by then the loop has finished with i equal to 2."
  whyWrong:
    "0": "That would need each lambda to remember its own i; use lambda i=i: i for that."
    "2": "range(3) stops at 2, so i never reaches 3."
    "3": "i is not reset to 0; it keeps the last value of the loop."

- id: late-binding-fix
  question: "Which version of the list gives [0, 1, 2] when every function is called?"
  options:
    - "[lambda: i for i in range(3)]"
    - "[lambda: i for i in [0, 1, 2]]"
    - "[lambda i=i: i for i in range(3)]"
    - "[lambda i: i for i in range(3)]"
  answer: 2
  explanation: "A default is evaluated when the lambda is created, so lambda i=i: i saves each loop value."
  whyWrong:
    "0": "Every one of these reads i late, so all of them return 2."
    "1": "Looping over a list instead of range changes nothing: the lambdas still read i when called."
    "3": "This lambda needs an argument, so calling it with none raises TypeError."

- id: spot-bug-unbound-local
  kind: spot-bug
  question: "Calling bump() raises UnboundLocalError. What is the bug?"
  code: |
    total = 0

    def bump():
        total += 1
        return total

    bump()
  options:
    - "total is assigned inside bump, which makes it local, and it has no value yet"
    - "Integers cannot be changed"
    - "Functions cannot read module-level names"
    - "return must come before the assignment"
  answer: 0
  explanation: "Assigning to a name inside a function makes that name local for the whole function. total += 1 reads a local that has no value yet. Pass total in and return the new value, or declare global total."
  whyWrong:
    "1": "Integers are immutable, but the problem is the scope of the name, not the type."
    "2": "Functions can read module-level names; the trouble starts only when they assign to one."
    "3": "The order of return and the assignment is not the issue."

- id: nonlocal-counter
  kind: predict-output
  question: "What does this print?"
  code: |
    def counter():
        n = 0
        def inc():
            nonlocal n
            n += 1
            return n
        return inc

    c = counter()
    print(c(), c(), c())
  options:
    - "1 1 1"
    - "0 1 2"
    - "UnboundLocalError"
    - "1 2 3"
  answer: 3
  explanation: "inc keeps using the same n from counter's call, and each call adds one to it, so the results are 1, 2 and 3."
  whyWrong:
    "0": "That would happen if n were a new local on each call. nonlocal ties it to the enclosing n."
    "1": "The count starts at 0 but is increased before it is returned."
    "2": "nonlocal n is exactly what prevents that error."

- id: mutate-vs-rebind
  kind: predict-output
  question: "What does this print?"
  code: |
    def mutate(lst):
        lst.append(9)

    def rebind(lst):
        lst = [0]

    a = [1]
    mutate(a)
    rebind(a)
    print(a)
  options:
    - "[1]"
    - "[1, 9]"
    - "[0]"
    - "[0, 9]"
  answer: 1
  explanation: "mutate changes the very list the caller passed. rebind only points its own local name at a new list, so the caller's list is untouched."
  whyWrong:
    "0": "The append in mutate does change the caller's list."
    "2": "Rebinding the parameter name does not affect the caller's name."
    "3": "rebind never touches a, so the 0 never appears."

- id: parameter-vs-argument
  question: "In def area(width, height): and the call area(3, 4), what are 3 and 4?"
  options:
    - "Parameters"
    - "Keywords"
    - "Arguments"
    - "Defaults"
  answer: 2
  explanation: "Parameters are the names in the definition; arguments are the values you pass in the call."
  whyWrong:
    "0": "width and height are the parameters."
    "1": "They are passed by position, and keyword would mean name=value."
    "3": "They are given in the call; nothing says they are default values."

