- id: predict-mutable-default
  kind: predict-output
  question: "What do the two prints show?"
  code: |
    def add_item(x, items=[]):
        items.append(x)
        return items

    print(add_item(1))
    print(add_item(2))
  options:
    - "[1] then [2]"
    - "[1, 2] then [1, 2]"
    - "[1] then [1, 2]"
    - "An error on the second call"
  answer: 2
  explanation: "The default list is created once, when def runs, and reused by every call that omits the argument. The second call appends to the same list."
  whyWrong:
    "0": "That would need a new list on each call, which is what the None-default pattern does, not this code."
    "1": "Each print shows the list as it is right after its own call, so the first print still shows only [1]."
    "3": "Nothing raises; the shared default is a perfectly valid list."

- id: default-evaluated-when
  question: "When is the default value expression in def f(x, items=[]) evaluated?"
  options:
    - "Once, when the def statement runs"
    - "On every call that omits the argument"
    - "Only the first time the function is called"
    - "When the function returns"
  answer: 0
  explanation: "Defaults are evaluated at definition time, once, and the resulting object is reused on every call."
  whyWrong:
    "1": "That is what many people expect, and it is why a mutable default surprises them. Python does not re-evaluate it."
    "2": "The object is built earlier than that, when the def line itself executes."
    "3": "Return has nothing to do with defaults."

- id: none-default-fix
  question: "Which is the standard fix for a function that must start with a new empty list when none is passed?"
  options:
    - "Write items=list in the header"
    - "Use one global list that every call appends to"
    - "Write items=[] but call .clear() at the end"
    - "Default to None and create the list inside the function"
  answer: 3
  explanation: "Use items=None, then 'if items is None: items = []' inside, so each call that omits the argument gets its own list."
  whyWrong:
    "0": "list is the type, not a new empty list; the function would receive the class itself."
    "1": "Every call would then share that one global list, which is the same bug."
    "2": "Clearing at the end still shares one object between calls, and it would erase a list the caller passed in."

- id: no-return-value
